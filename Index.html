<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de Restaurantes · Madelyn Avila Nutrición</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F0EA;--card:#fff;--tx:#3a3a3a;--g:#808B62;--r:#C18A8C;--m:#8C5355;--bd:#e6d9d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2323;--card:#352c2c;--tx:#eee4de;--bd:#4a3e3e;--m:#e0a6a8}}
:root[data-theme="dark"]{--bg:#2a2323;--card:#352c2c;--tx:#eee4de;--bd:#4a3e3e;--m:#e0a6a8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Lato,system-ui,sans-serif}
header{background:var(--g);color:#F7F0EA;padding:28px 18px 22px;text-align:center}
h1{font-family:Montserrat,sans-serif;margin:0 0 6px;font-size:1.6rem}header p{margin:0;opacity:.92}
.wrap{max-width:900px;margin:0 auto;padding:16px}
input{width:100%;padding:13px 16px;border-radius:999px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:1rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--g);background:transparent;color:var(--g);padding:7px 13px;border-radius:999px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--g);color:#fff}
.tip{background:var(--card);border-left:4px solid var(--r);padding:12px 14px;border-radius:10px;font-size:.9rem;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px}
.top{display:flex;justify-content:space-between;align-items:start;gap:8px}
h2{font-family:Montserrat,sans-serif;color:var(--m);font-size:1.02rem;margin:0}
.cat{font-size:.72rem;color:var(--g);text-transform:uppercase;letter-spacing:.06em}
.ic{background:none;border:none;font-size:1.25rem;cursor:pointer;color:var(--r)}
ul{padding-left:18px;margin:10px 0}li{margin:4px 0;font-size:.92rem}
.b{display:inline-block;background:var(--r);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 8px;margin-left:4px;font-weight:700}
.sh{border:1px solid var(--r);color:var(--m);background:none;border-radius:999px;padding:5px 12px;font:inherit;font-size:.8rem;cursor:pointer}
.empty{text-align:center;padding:40px;opacity:.7}
</style></head><body>
